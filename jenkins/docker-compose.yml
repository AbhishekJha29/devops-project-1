version: '3.8'

services:
  jenkins:
    build: .
    container_name: jenkins-server
    restart: unless-stopped
    user: root
    ports:
      - "8080:8080"
      - "50000:50000"
    volumes:
      - jenkins_data:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
      # Mount flattened kubeconfig generated on the Windows host.
      # Note: This file must be manually generated on the host BEFORE starting Jenkins using:
      #   kubectl config view --minify --flatten > jenkins/jenkins-kubeconfig.yaml
      # Flattening embeds certificate data directly and prevents Windows file path resolution errors in Linux containers.
      - ./jenkins-kubeconfig.yaml:/root/.kube/config:ro
      - ./jenkins-kubeconfig.yaml:/var/jenkins_home/.kube/config:ro

volumes:
  jenkins_data:
    driver: local